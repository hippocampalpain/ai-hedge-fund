# 계정과목 매핑표 — DART 전체 재무제표(fnlttSinglAcntAll) 행에서 항목을 찾는 규칙.
#
# 각 항목:
#   kind:  stock = 기말 잔액(재무상태표), flow = 기간 금액(손익·현금흐름, DART에서는 누적)
#   sj:    찾을 재무제표 구분 (BS 재무상태표, IS 손익계산서, CIS 포괄손익계산서, CF 현금흐름표)
#          앞에 있는 것부터 찾는다. 손익계산서 없이 포괄손익계산서만 내는 회사가 있어서 IS, CIS 순서.
#   ids:   XBRL 표준계정 ID (account_id). 먼저 이것으로 정확히 일치하는 행을 찾는다.
#   names: account_id로 못 찾으면 쓰는 계정명(account_nm) 후보. 공백·번호(Ⅰ. 1. (1))를 지우고 정확히 비교한다.
#
# 같은 조건에 맞는 행이 여러 개면 ord(정렬순서)가 가장 앞선 행을 쓴다.
# 회사마다 계정명이 달라서 못 찾는 경우가 있다 → 그 항목은 None이 되고, 그 항목을 쓰는 지표도 None.
# 새 회사를 다루다 빠진 계정이 보이면 여기 names에 추가하면 된다 (코드 수정 불필요).

# ---------------- 재무상태표 (기말 잔액) ----------------
total_assets:
  kind: stock
  sj: [BS]
  ids: [ifrs-full_Assets]
  names: [자산총계]
total_liabilities:
  kind: stock
  sj: [BS]
  ids: [ifrs-full_Liabilities]
  names: [부채총계]
total_equity:
  kind: stock
  sj: [BS]
  ids: [ifrs-full_Equity]
  names: [자본총계]
equity_parent:
  kind: stock
  sj: [BS]
  ids: [ifrs-full_EquityAttributableToOwnersOfParent]
  names: [지배기업의소유주에게귀속되는자본, 지배기업소유주지분, 지배기업의소유주지분, 지배주주지분]
current_assets:
  kind: stock
  sj: [BS]
  ids: [ifrs-full_CurrentAssets]
  names: [유동자산]
current_liabilities:
  kind: stock
  sj: [BS]
  ids: [ifrs-full_CurrentLiabilities]
  names: [유동부채]
cash:
  kind: stock
  sj: [BS]
  ids: [ifrs-full_CashAndCashEquivalents]
  names: [현금및현금성자산]
inventories:
  kind: stock
  sj: [BS]
  ids: [ifrs-full_Inventories]
  names: [재고자산]
receivables:
  kind: stock
  sj: [BS]
  ids: [ifrs-full_CurrentTradeReceivables, dart_ShortTermTradeReceivable, ifrs-full_TradeAndOtherCurrentReceivables]
  names: [매출채권, 매출채권및기타채권, 매출채권및기타유동채권]
short_term_borrowings:
  kind: stock
  sj: [BS]
  ids: [ifrs-full_ShorttermBorrowings]
  names: [단기차입금]
current_portion_lt_debt:
  kind: stock
  sj: [BS]
  ids: [ifrs-full_CurrentPortionOfLongtermBorrowings]
  names: [유동성장기부채, 유동성장기차입금]
long_term_borrowings:
  kind: stock
  sj: [BS]
  ids: [ifrs-full_LongtermBorrowings, dart_LongTermBorrowingsGross]
  names: [장기차입금]
bonds:
  kind: stock
  sj: [BS]
  ids: [dart_BondsIssued, ifrs-full_NoncurrentPortionOfNoncurrentBondsIssued]
  names: [사채]

# ---------------- 손익계산서 (누적 금액 → 분기 차감) ----------------
revenue:
  kind: flow
  sj: [IS, CIS]
  ids: [ifrs-full_Revenue]
  names: [매출액, 수익(매출액), 영업수익, 매출]
cost_of_sales:
  kind: flow
  sj: [IS, CIS]
  ids: [ifrs-full_CostOfSales]
  names: [매출원가]
gross_profit:
  kind: flow
  sj: [IS, CIS]
  ids: [ifrs-full_GrossProfit]
  names: [매출총이익, 매출총이익(손실)]
operating_income:
  kind: flow
  sj: [IS, CIS]
  ids: [dart_OperatingIncomeLoss, ifrs-full_ProfitLossFromOperatingActivities]
  names: [영업이익, 영업이익(손실)]
pretax_income:
  kind: flow
  sj: [IS, CIS]
  ids: [ifrs-full_ProfitLossBeforeTax]
  names: [법인세비용차감전순이익, 법인세비용차감전순이익(손실)]
income_tax:
  kind: flow
  sj: [IS, CIS]
  ids: [ifrs-full_IncomeTaxExpenseContinuingOperations]
  names: [법인세비용, 법인세비용(수익)]
net_income:
  kind: flow
  sj: [IS, CIS]
  ids: [ifrs-full_ProfitLoss]
  names: [당기순이익, 당기순이익(손실), 분기순이익, 반기순이익]
net_income_parent:
  kind: flow
  sj: [IS, CIS]
  ids: [ifrs-full_ProfitLossAttributableToOwnersOfParent]
  names: [지배기업의소유주에게귀속되는당기순이익, 지배기업소유주지분, 지배기업의소유주지분, 지배주주지분]
interest_expense:
  kind: flow
  sj: [IS, CIS]
  ids: [ifrs-full_InterestExpense]
  names: [이자비용]

# ---------------- 현금흐름표 (누적 금액 → 분기 차감) ----------------
operating_cash_flow:
  kind: flow
  sj: [CF]
  ids: [ifrs-full_CashFlowsFromUsedInOperatingActivities]
  names: [영업활동현금흐름, 영업활동으로인한현금흐름]
capex:
  kind: flow
  sj: [CF]
  ids: [ifrs-full_PurchaseOfPropertyPlantAndEquipment]
  names: [유형자산의취득]
depreciation:
  kind: flow
  sj: [CF]
  ids: [ifrs-full_AdjustmentsForDepreciationExpense, ifrs-full_AdjustmentsForDepreciationAndAmortisationExpense]
  names: [감가상각비, 감가상각비조정]
amortization:
  kind: flow
  sj: [CF]
  ids: [ifrs-full_AdjustmentsForAmortisationExpense]
  names: [무형자산상각비]
dividends_paid:
  kind: flow
  sj: [CF]
  ids: [ifrs-full_DividendsPaidClassifiedAsFinancingActivities]
  names: [배당금지급, 배당금의지급]
